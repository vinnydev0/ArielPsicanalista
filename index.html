<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F5EF">
  <meta name="description" content="Ariel Psicanalista — um espaço de escuta, acolhimento e autoconhecimento.">
  <title>Ariel Psicanalista | Escuta e Acolhimento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --cream: #F7F5EF;
      --white: #FFFFFF;
      --green: #315A4D;
      --green-dark: #234438;
      --green-light: #E8EFE8;
      --gold: #C5A66B;
      --text: #303A34;
      --muted: #737A73;
      --border: #E5E3DA;
    }

    /* Força o tema claro, independentemente do CSS externo */
    html {
      color-scheme: light;
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
      background: var(--cream);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--cream) !important;
      color: var(--text) !important;
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    img { max-width: 100%; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 86px;
      padding: 15px 7%;
      background: #FFFFFF !important;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--green);
    }

    .brand-symbol {
      width: 44px;
      height: 44px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-family: 'Cormorant Garamond', serif;
      font-size: 27px;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 31px;
      line-height: 1;
      font-weight: 600;
    }

    .brand-subtitle {
      display: block;
      margin-top: 6px;
      font-size: 9px;
      letter-spacing: 3px;
      font-weight: 600;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 27px;
    }

    .main-nav a {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .main-nav a:hover { color: var(--green); }

    .main-nav .nav-cta {
      padding: 11px 18px;
      border-radius: 5px;
      background: var(--green);
      color: #FFFFFF;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: 65px;
      padding: 80px 7%;
      max-width: 1600px;
      margin: auto;
    }

    .eyebrow {
      color: var(--green);
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 700;
      margin: 0 0 20px;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
    }

    .hero h1 {
      color: var(--green-dark);
      font-size: clamp(46px, 5.4vw, 76px);
      line-height: 1.04;
      margin: 0 0 25px;
      max-width: 650px;
    }

    .hero-description {
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 2;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      transition: .2s ease;
    }

    .button-primary {
      background: var(--green);
      color: #FFFFFF;
    }

    .button-primary:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
    }

    .button-outline {
      border: 1px solid #C9D2C9;
      color: var(--green);
    }

    .button-outline:hover { background: var(--green-light); }

    .hero-photo {
      min-height: 460px;
      background: #E7E5DB url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1200&q=85') center/cover no-repeat;
      border-radius: 48% 48% 8px 8px;
      box-shadow: 0 20px 55px rgba(38,60,47,.10);
    }

    .section {
      padding: 95px 7%;
    }

    .about {
      background: #FFFFFF !important;
      display: grid;
      grid-template-columns: .9fr 1fr;
      align-items: center;
      gap: 75px;
    }

    .about-photo {
      min-height: 420px;
      border-radius: 7px;
      background: #E8E7DF url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1100&q=85') center/cover no-repeat;
    }

    .about h2, .services h2, .contact h2 {
      color: var(--green-dark);
      font-size: clamp(40px, 4.4vw, 58px);
      line-height: 1.1;
      margin: 0 0 23px;
    }

    .section-copy {
      color: var(--muted);
      font-size: 14px;
      line-height: 2;
    }

    .quote {
      margin-top: 28px;
      border-left: 3px solid var(--gold);
      padding: 5px 0 5px 20px;
      color: var(--green);
      font-family: 'Cormorant Garamond', serif;
      font-size: 25px;
      font-style: italic;
    }

    .services {
      background: var(--cream) !important;
      text-align: center;
    }

    .services-intro {
      max-width: 680px;
      margin: 0 auto 45px;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      text-align: left;
    }

    .service-card {
      background: #FFFFFF !important;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 30px;
      transition: .2s ease;
    }

    .service-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(38,60,47,.08);
    }

    .service-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--green-light);
      color: var(--green);
      font-size: 22px;
      margin-bottom: 20px;
    }

    .service-card h3 {
      color: var(--green-dark);
      font-size: 27px;
      margin: 0 0 10px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
      margin: 0;
    }

    .how {
      background: #FFFFFF !important;
      text-align: center;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 30px;
      margin-top: 45px;
    }

    .step-number {
      color: var(--gold);
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
    }

    .step h3 {
      color: var(--green-dark);
      font-size: 25px;
      margin: 5px 0 10px;
    }

    .step p {
      color: var(--muted);
      font-size: 13px;
    }

    .contact {
      background: var(--green) !important;
      padding: 75px 7%;
    }

    .contact-panel {
      max-width: 1120px;
      margin: auto;
      padding: 50px;
      border-radius: 8px;
      background: #FFFFFF !important;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .contact-form label {
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }

    .contact-form input,
    .contact-form textarea {
      display: block;
      width: 100%;
      margin-top: 5px
